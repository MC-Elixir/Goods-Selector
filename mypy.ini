[mypy]
python_version = 3.12
ignore_missing_imports = True
warn_return_any = False
warn_unused_configs = True
disallow_untyped_defs = False
disallow_incomplete_defs = False
check_untyped_defs = True
no_implicit_optional = False
strict_optional = False

# Non-target modules: suppress errors (mypy follows imports into these)
[mypy-agent.*]
ignore_errors = True

[mypy-schemas.*]
ignore_errors = True

[mypy-domain.*]
ignore_errors = True

[mypy-crawlers.*]
ignore_errors = True

[mypy-db.*]
ignore_errors = True

[mypy-execution.*]
ignore_errors = True

[mypy-reports.*]
ignore_errors = True
